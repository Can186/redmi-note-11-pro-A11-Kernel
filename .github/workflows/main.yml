name: Build pissarro Kernel with WLAN
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4

      - name: 添加 stpcpy 实现
        run: |
          if ! grep -q "char \*stpcpy" lib/string.c; then
            printf '\n#ifndef __HAVE_ARCH_STPCPY\nchar *stpcpy(char *dest, const char *src)\n{\n\twhile ((*dest = *src) != '\''\\0'\'') {\n\t\tdest++;\n\t\tsrc++;\n\t}\n\treturn dest;\n}\nEXPORT_SYMBOL(stpcpy);\n#endif\n' >> lib/string.c
          fi
          grep -n "stpcpy" lib/string.c | head -5

      - name: 安装工具链
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends libelf-dev bison flex bc || true

          echo "=== 检查依赖 ==="
          for pkg in flex bison bc make zip wget git python3; do
            which $pkg >/dev/null 2>&1 && echo "  $pkg: OK" || echo "  $pkg: MISSING"
          done
          dpkg -l | grep -E "^ii.*(libelf-dev|libssl-dev)" || true

          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          tar -xf clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C /opt
          mv /opt/clang+llvm-12.0.1-x86_64-linux-gnu-* /opt/clang12

          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64

          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

          echo "=== 工具链检查 ==="
          /opt/clang12/bin/clang --version || true

          exit 0

      - name: 拉取 MTK 驱动模块
        run: |
          mkdir -p vendor/mediatek
          git clone --depth=1 --branch pissarro-r-oss \
            https://github.com/MiCode/MTK_kernel_modules.git \
            vendor/mediatek/kernel_modules
          echo "=== connectivity 结构 ==="
          ls vendor/mediatek/kernel_modules/connectivity/
          echo "=== wlan 结构 ==="
          ls vendor/mediatek/kernel_modules/connectivity/wlan/
          ls vendor/mediatek/kernel_modules/connectivity/wlan/core/

      - name: 修改 WLAN 驱动 Makefile 的 TOP
        run: |
          for f in \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile \
            vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/Makefile; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              grep -n "^TOP" "$f" || echo "  (no TOP)"
              sed -i 's|TOP[[:space:]]*:=[[:space:]]*\$(srctree)/\.\.|TOP := $(srctree)/|' "$f"
              grep -n "^TOP" "$f" || echo "  (still no TOP)"
            fi
          done

      - name: 修改 connectivity/Makefile
        run: |
          CONN_MK="drivers/misc/mediatek/connectivity/Makefile"
          cp "$CONN_MK" "${CONN_MK}.bak"

          # 去 ../ 和改 unlink/ln
          sed -i 's|\$(srctree)/\.\./|\$(srctree)/|g' "$CONN_MK"
          sed -i 's|\bunlink\b|rm -rf|g' "$CONN_MK"
          sed -i 's|\bln -s\b|ln -snf|g' "$CONN_MK"

          # ABS_PATH 包 abspath
          sed -i 's|ABS_PATH_TO_WMT_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WMT_DRV)|ABS_PATH_TO_WMT_DRV       = \$(abspath \$(srctree)/\$(PATH_TO_WMT_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_WLAN_CHR_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WLAN_CHR_DRV)|ABS_PATH_TO_WLAN_CHR_DRV  = \$(abspath \$(srctree)/\$(PATH_TO_WLAN_CHR_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_WLAN_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WLAN_DRV)|ABS_PATH_TO_WLAN_DRV      = \$(abspath \$(srctree)/\$(PATH_TO_WLAN_DRV))|' "$CONN_MK"

          echo "=== 验证 ==="
          grep -n -E "ABS_PATH_TO_(WMT|WLAN)|PATH_TO_(WMT|WLAN)" "$CONN_MK" | head -20
          grep -n -E "ln -snf|rm -rf" "$CONN_MK" | head -10

      - name: 创建 WLAN 软链接
        run: |
          CONN_DIR="drivers/misc/mediatek/connectivity"
          for d in wmt_drv wmt_chrdev_wifi wlan_drv_gen4m; do
            rm -rf "$CONN_DIR/$d"
          done

          # Pissarro (MT6877) 用 conninfra，不是 common
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/conninfra" "$CONN_DIR/wmt_drv"
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/adaptor" "$CONN_DIR/wmt_chrdev_wifi"
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m" "$CONN_DIR/wlan_drv_gen4m"

          ls -la "$CONN_DIR" | grep "^l"
          test -f "$CONN_DIR/wmt_drv/Makefile" && echo "wmt_drv/Makefile OK" || echo "wmt_drv/Makefile MISSING"
          test -f "$CONN_DIR/wmt_chrdev_wifi/Makefile" && echo "wmt_chrdev_wifi/Makefile OK" || echo "wmt_chrdev_wifi/Makefile MISSING"
          test -f "$CONN_DIR/wlan_drv_gen4m/Makefile" && echo "wlan_drv_gen4m/Makefile OK" || echo "wlan_drv_gen4m/Makefile MISSING"

      - name: 修复 wmt_drv 的 AUTOCONF_H
        run: |
          WMT_MK="drivers/misc/mediatek/connectivity/wmt_drv/Makefile"
          if [ -f "$WMT_MK" ]; then
            sed -i '1i AUTOCONF_H ?= $(srctree)/$(objtree)/include/generated/autoconf.h' "$WMT_MK"
            head -5 "$WMT_MK"
          fi

      - name: 修复头文件路径
        run: |
          BASE="\$(srctree)/vendor/mediatek/kernel_modules/connectivity"
          ADAPTOR_MK="vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/Makefile"
          GEN4M_MK="vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile"

          for i in \
            "$BASE/conninfra/debug_utility" \
            "$BASE/conninfra/debug_utility/include" \
            "$BASE/conninfra/debug_utility/coredump" \
            "$BASE/conninfra/debug_utility/coredump/platform/include" \
            "$BASE/conninfra/debug_utility/connsyslog/include" \
            "$BASE/conninfra/debug_utility/connsyslog/platform/include" \
            "$BASE/conninfra/debug_utility/step/include" \
            "$BASE/conninfra/include" \
            "$BASE/conninfra/core/include" \
            "$BASE/conninfra/platform/include" \
            "$BASE/conninfra/base/include" \
            "$BASE/conninfra/conf/include"; do
            if [ -f "$ADAPTOR_MK" ]; then
              sed -i "1i ccflags-y += -I$i" "$ADAPTOR_MK"
            fi
            if [ -f "$GEN4M_MK" ]; then
              sed -i "1i ccflags-y += -I$i" "$GEN4M_MK"
            fi
          done

          echo "=== adaptor 前 20 行 ==="
          head -20 "$ADAPTOR_MK" 2>/dev/null || true
          echo "=== gen4m 前 20 行 ==="
          head -20 "$GEN4M_MK" 2>/dev/null || true

      - name: 修复 CONNLOG_TYPE_WIFI
        run: |
          ADAPTOR_C="vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/fw_log_wifi.c"
          if [ -f "$ADAPTOR_C" ]; then
            sed -i 's/\bCONNLOG_TYPE_WIFI\b/CONN_DEBUG_TYPE_WIFI/g' "$ADAPTOR_C"
            grep -n "CONN_DEBUG_TYPE_WIFI" "$ADAPTOR_C" | head -5
          fi
      - name: 恢复 conninfra drv_init 原始文件
        run: |
          BASE_URL="https://raw.githubusercontent.com/MiCode/MTK_kernel_modules/pissarro-r-oss/connectivity/conninfra/drv_init"
          DIR="vendor/mediatek/kernel_modules/connectivity/conninfra/drv_init"
          for f in bluetooth_drv_init.c gps_drv_init.c conn_drv_init.c fm_drv_init.c wlan_drv_init.c; do
            curl -L -s -o "$DIR/$f" "$BASE_URL/$f"
          done
          echo "=== 恢复后 ==="
          grep -n "_drv_init" "$DIR"/bluetooth_drv_init.c "$DIR"/gps_drv_init.c

      - name: 修复 conninfra drv_init 空参数
        run: |
          DIR="vendor/mediatek/kernel_modules/connectivity/conninfra/drv_init"
          if [ -d "$DIR" ]; then
            for f in "$DIR"/*.c; do
              echo "=== $f ==="
              echo "--- 修改前 ---"
              grep -n "_drv_init" "$f"
              sed -i 's/\(__attribute__((weak)) [a-zA-Z_][a-zA-Z0-9_]*_drv_init\)()/\1(void)/' "$f"
              echo "--- 修改后 ---"
              grep -n "_drv_init" "$f"
            done
          fi
      - name: 集成 KernelSU Next v1.0.8
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.8
          echo "=== KernelSU-Next 目录 ==="
          ls -la KernelSU-Next/ 2>/dev/null || ls -la KernelSU/ 2>/dev/null || true
          echo "=== Kconfig 里的 config 名 ==="
          grep -rn "config KSU" KernelSU-Next/Kconfig 2>/dev/null | head -20 || grep -rn "config KSU" KernelSU/Kconfig 2>/dev/null | head -20 || true
          
      - name: 编译内核
        run: |
          export PATH="/opt/clang12/bin:/opt/gcc-arm64/bin:/opt/gcc-arm32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error -Wno-void-pointer-to-int-cast"

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out pissarro_user_defconfig

          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --disable LTO_CLANG \
            --enable CONFIG_MTK_CONNSYS_DEDICATED_LOG_PATH \
            --enable CONFIG_KSU \
            --enable CONFIG_KPROBES \
            --enable CONFIG_HAVE_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_WLAN_DRV_BUILD_IN \
            --enable CONFIG_MTK_COMBO_WIFI \
            --set-str CONFIG_MTK_COMBO_CHIP CONSYS_6877 \
            --set-str CONFIG_LOCALVERSION "-六花"

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out olddefconfig

          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-六花"

          echo "=== 验证配置 ==="
          grep -E "CONFIG_(LTO_CLANG|CC_STACKPROTECTOR_STRONG|LOCALVERSION|KSU|KPROBES|KPROBE_EVENTS|MODULES|WLAN_DRV_BUILD_IN|MTK_COMBO_WIFI|MTK_COMBO_CHIP)" out/.config || true

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out \
            AUTOCONF_H=$(pwd)/out/include/generated/autoconf.h \
            CONFIG_WLAN_DRV_BUILD_IN=y 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: 编译失败时打印错误上下文
        if: failure()
        run: |
          echo "=== 查找所有 error 行 ==="
          grep -n -i "error" build.log 2>/dev/null | grep -v "Werror" | head -50 || true
          echo ""
          echo "=== 最后 300 行 ==="
          tail -300 build.log 2>/dev/null || true

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU Next1.0.8
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/mt6877.dtb
