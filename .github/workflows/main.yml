name: Build pissarro Kernel with WLAN
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4

      - name: 添加 stpcpy 实现
        run: |
          if ! grep -q "char \*stpcpy" lib/string.c; then
            printf '\n#ifndef __HAVE_ARCH_STPCPY\nchar *stpcpy(char *dest, const char *src)\n{\n\twhile ((*dest = *src) != '\''\\0'\'') {\n\t\tdest++;\n\t\tsrc++;\n\t}\n\treturn dest;\n}\nEXPORT_SYMBOL(stpcpy);\n#endif\n' >> lib/string.c
          fi
          grep -n "stpcpy" lib/string.c | head -5

      - name: 安装工具链
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list || true
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends libelf-dev bison flex bc || true

          echo "=== 检查依赖 ==="
          for pkg in flex bison bc make zip wget git python3; do
            which $pkg >/dev/null 2>&1 && echo "  $pkg: OK" || echo "  $pkg: MISSING"
          done
          dpkg -l | grep -E "^ii.*(libelf-dev|libssl-dev)" || true

          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          tar -xf clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C /opt
          mv /opt/clang+llvm-12.0.1-x86_64-linux-gnu-* /opt/clang12

          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64

          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

          echo "=== 工具链检查 ==="
          /opt/clang12/bin/clang --version || true

          exit 0

      - name: 拉取 MTK 驱动模块
        run: |
          mkdir -p vendor/mediatek
          git clone --depth=1 --branch pissarro-r-oss \
            https://github.com/MiCode/MTK_kernel_modules.git \
            vendor/mediatek/kernel_modules
          echo "=== connectivity 结构 ==="
          ls vendor/mediatek/kernel_modules/connectivity/
          echo "=== wlan 结构 ==="
          ls vendor/mediatek/kernel_modules/connectivity/wlan/
          ls vendor/mediatek/kernel_modules/connectivity/wlan/core/

      - name: 修改 WLAN 驱动 Makefile 的 TOP
        run: |
          for f in \
            vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m/Makefile \
            vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/Makefile; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              grep -n "^TOP" "$f" || echo "  (no TOP)"
              sed -i 's|TOP[[:space:]]*:=[[:space:]]*\$(srctree)/\.\.|TOP := $(srctree)/|' "$f"
              grep -n "^TOP" "$f" || echo "  (still no TOP)"
            fi
          done

      - name: 修改 connectivity/Makefile
        run: |
          CONN_MK="drivers/misc/mediatek/connectivity/Makefile"
          cp "$CONN_MK" "${CONN_MK}.bak"

          # 去 ../ 和改 unlink/ln
          sed -i 's|\$(srctree)/\.\./|\$(srctree)/|g' "$CONN_MK"
          sed -i 's|\bunlink\b|rm -rf|g' "$CONN_MK"
          sed -i 's|\bln -s\b|ln -snf|g' "$CONN_MK"

          # ABS_PATH 包 abspath
          sed -i 's|ABS_PATH_TO_WMT_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WMT_DRV)|ABS_PATH_TO_WMT_DRV       = \$(abspath \$(srctree)/\$(PATH_TO_WMT_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_WLAN_CHR_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WLAN_CHR_DRV)|ABS_PATH_TO_WLAN_CHR_DRV  = \$(abspath \$(srctree)/\$(PATH_TO_WLAN_CHR_DRV))|' "$CONN_MK"
          sed -i 's|ABS_PATH_TO_WLAN_DRV[[:space:]]*=[[:space:]]*\$(srctree)/\$(PATH_TO_WLAN_DRV)|ABS_PATH_TO_WLAN_DRV      = \$(abspath \$(srctree)/\$(PATH_TO_WLAN_DRV))|' "$CONN_MK"

          echo "=== 验证 ==="
          grep -n -E "ABS_PATH_TO_(WMT|WLAN)|PATH_TO_(WMT|WLAN)" "$CONN_MK" | head -20
          grep -n -E "ln -snf|rm -rf" "$CONN_MK" | head -10

      - name: 创建 WLAN 软链接
        run: |
          CONN_DIR="drivers/misc/mediatek/connectivity"
          for d in wmt_drv wmt_chrdev_wifi wlan_drv_gen4m; do
            rm -rf "$CONN_DIR/$d"
          done

          # Pissarro (MT6877) 用 conninfra，不是 common
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/conninfra" "$CONN_DIR/wmt_drv"
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wlan/adaptor" "$CONN_DIR/wmt_chrdev_wifi"
          ln -snf "$(pwd)/vendor/mediatek/kernel_modules/connectivity/wl
