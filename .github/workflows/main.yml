name: Build pissarro Kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list || true
          sudo sed -i 's|security.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update || true
          sudo apt-get install -f -y flex bison bc libelf-dev libssl-dev make zip wget git python3 || true
          sudo apt-get install -f -y || true

          echo "=== 检查依赖 ==="
          for pkg in flex bison bc make zip wget git python3; do
            which $pkg >/dev/null 2>&1 && echo "  $pkg: OK" || echo "  $pkg: MISSING"
          done
          dpkg -l | grep -E "^ii.*(libelf-dev|libssl-dev)" || true

          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          tar -xf clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C /opt
          mv /opt/clang+llvm-12.0.1-x86_64-linux-gnu-* /opt/clang12

          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64

          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

          echo "=== 工具链检查 ==="
          /opt/clang12/bin/clang --version || true
          ls /opt/gcc-arm64/bin/ | head -5
          ls /opt/gcc-arm32/bin/ | head -5

      - name: 编译内核
        run: |
          export PATH="/opt/clang12/bin:/opt/gcc-arm64/bin:/opt/gcc-arm32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error -Wno-void-pointer-to-int-cast"

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out pissarro_user_defconfig

          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --disable LTO_CLANG \
            --set-str CONFIG_LOCALVERSION "-六花"

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out olddefconfig

          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-六花"

          echo "=== 验证配置 ==="
          grep -E "CONFIG_(LTO_CLANG|CC_STACKPROTECTOR_STRONG|LOCALVERSION)" out/.config || true

          make -j$(nproc) ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld O=out 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: 编译失败时打印错误上下文
        if: failure()
        run: |
          echo "=== 查找所有 error 行 ==="
          grep -n -i "error" build.log 2>/dev/null | grep -v "Werror" | head -50 || true
          echo ""
          echo "=== 最后 150 行 ==="
          tail -150 build.log 2>/dev/null || true

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_pissarro_clean
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/mediatek/k6877v1_64.dtb
